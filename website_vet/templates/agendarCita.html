{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agendar Cita - Veterinaria Dos Patitas</title>
    <link rel="stylesheet" href="{% static 'css/estilosAgendar.css' %}">
    <link rel="stylesheet" href="{% static 'css/estilosNav.css' %}">   
</head>
<body>

    <header>
        <nav class="navbar">
            <div class="logo">
                <h1>Veterinaria Dos Patitas</h1>
            </div>
            <ul class="nav-links">
                <li><a href="{% url 'inicio' %}">Inicio</a></li>
                <li><a href="{% url 'nosotros' %}">Nosotros</a></li>
                <li><a href="{% url 'servicios' %}">Servicios</a></li>
                <li><a href="{% url 'sucursales' %}">Sucursales</a></li>
            </ul>
            <a href="{% url 'agendar' %}" class="btn-nav">Agenda tu cita</a>
        </nav>
    </header>

    <main>
        <div class="agendar-container">

            <h2 class="animar">¡Agenda tu cita con nosotros!</h2>

            <form action="" class="form-cita">

                <div class="form-seccion animar">
                    <h3>Datos del dueño</h3>
                    <div class="form-grupo">
                        <label for="nombre">Nombre completo:</label>
                        <input type="text" name="nombre" id="nombre" placeholder="Ej. Juan Pérez">
                    </div>
                    <div class="form-grupo">
                        <label for="telefono">Teléfono:</label>
                        <input type="text" name="telefono" id="telefono" placeholder="Ej. 81 1234 5678">
                    </div>
                    <div class="form-grupo">
                        <label for="correo">Correo electrónico:</label>
                        <input type="email" name="correo" id="correo" placeholder="Ej. correo@email.com">
                    </div>
                </div>

                <div class="form-seccion animar">
                    <h3>Datos de la mascota</h3>
                    <div class="form-grupo">
                        <label for="mascota">Nombre de la mascota:</label>
                        <input type="text" name="mascota" id="mascota" placeholder="Ej. Firulais">
                    </div>
                    <div class="form-grupo">
                        <label for="edad">Edad:</label>
                        <input type="text" name="edad" id="edad" placeholder="Ej. 3 años">
                    </div>
                    <div class="form-grupo">
                        <label for="especie">Especie:</label>
                        <select name="especie" id="especie">
                            <option value="perro">Perro</option>
                            <option value="gato">Gato</option>
                        </select>
                    </div>
                </div>

                <div class="form-seccion animar">
                    <h3>Datos de la cita</h3>
                    <div class="form-grupo">
                        <label for="sucursal">Sucursal:</label>
                        <select name="sucursal" id="sucursal">
                            <option value="enramada">Enramada</option>
                            <option value="sanFernando">San Fernando</option>
                        </select>
                    </div>
                    <div class="form-grupo">
                        <label for="servicio">Servicio:</label>
                        <select name="servicio" id="servicio">
                            <option value="limpieza">Limpieza dental</option>
                            <option value="baño">Baño y corte</option>
                            <option value="ortopedia">Consulta ortopédica</option>
                            <option value="cardiologia">Consulta cardiológica</option>
                            <option value="desparacitacion">Desparasitación</option>
                            <option value="vacunacion">Vacunación</option>
                            <option value="general">Consulta general</option>
                        </select>
                    </div>
                    <div class="form-grupo">
                        <label for="fecha">Fecha:</label>
                        <input type="date" name="fecha" id="fecha">
                    </div>
                    <div class="form-grupo">
                        <label for="hora">Hora:</label>
                        <input type="time" name="hora" id="hora">
                    </div>
                    <div class="form-grupo">
                        <label for="nota">Especificaciones:</label>
                        <input type="text" name="nota" id="nota" placeholder="Alguna nota adicional...">
                    </div>
                </div>

                <div class="animar">
                    <button type="submit" class="btn-confirmar">Confirmar cita</button>
                </div>

            </form>
        </div>
    </main>

    <aside></aside>
    <footer></footer>

    <script src="{% static 'scroll.js' %}"></script>

</body>
</html>
